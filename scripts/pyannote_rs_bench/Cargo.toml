[package]
name = "pyannote-rs-bench"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "diarize-pyannote-rs"
path = "src/main.rs"

[dependencies]
pyannote-rs = "0.3"
eyre = "0.6"
# pyannote-rs 0.3.4 accepts any ort >= 2.0.0-rc.10 but only compiles against rc.10, the last
# release on ndarray 0.16, so pin ort and ndarray to the versions it was written for
ort = { version = "=2.0.0-rc.10", features = ["ndarray"] }
ndarray = "0.16"
