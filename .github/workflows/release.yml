# Publish the speakrs command as a GitHub release when a version tag is pushed
#
#   bump the version in Cargo.toml, move the CHANGELOG.md "Unreleased" entries under a
#   "## [X.Y.Z] - YYYY-MM-DD" heading, merge to master, then
#   git tag vX.Y.Z
#   git push origin vX.Y.Z
#
# The tag must match the speakrs crate version and have a CHANGELOG.md entry, or the
# release fails before anything is built. The Package workflow publishes the Python
# wheels from the same tag; the crates go to crates.io separately.
#
# Asset names match install.sh, each archive with a .sha256 beside it:
#   speakrs-<tag>-x86_64-unknown-linux-gnu.tar.gz   (cpu, cuda)
#   speakrs-<tag>-aarch64-unknown-linux-gnu.tar.gz  (cpu)
#   speakrs-<tag>-aarch64-apple-darwin.tar.gz       (cpu, coreml)
#   install.sh
#
# The archives hold the speakrs command from crates/speakrs-cli (`speakrs diarize`, and
# `speakrs cuda tune` in the CUDA build), with the same backends per platform as the
# Python wheels plus a CPU build for Linux arm64. The x86_64 build opens libcuda, cuDNN
# and cuBLAS with dlopen, which a static musl build can't do, so Linux ships as glibc;
# cargo-zigbuild links against glibc 2.28, the same floor as the manylinux_2_28 wheel,
# instead of the runner's newer glibc. Its tuner is built with `cuda`, so it matches
# applications built with `cuda`, since a tune file applies only to the speakrs version
# and kernel set that wrote it. CUDA on Linux arm64 builds but hasn't run on a GPU, and
# Intel Macs and Windows aren't tested in CI, so neither ships.
#
# Pull requests that touch the release files or the command build and check the archives
# without uploading them.

name: Release

permissions:
  contents: read

# one run per tag at a time, so a second run can't pass the published-release check
# while the first is still publishing
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    tags:
      - "v*"
  pull_request:
    branches:
      - master
    paths:
      - .github/workflows/release.yml
      - install.sh
      - crates/speakrs-cli/**

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: -D warnings
  # the shipped binary keeps no symbols or line tables
  CARGO_PROFILE_RELEASE_DEBUG: "false"
  CARGO_PROFILE_RELEASE_STRIP: symbols

jobs:
  create-release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Check the crate matches the tag
        shell: bash
        run: |
          set -euo pipefail
          version="$(cargo metadata --no-deps --format-version 1 --locked \
            | jq -r '.packages[] | select(.name == "speakrs") | .version')"
          echo "crate version: $version, tag: $GITHUB_REF_NAME"
          test "v$version" = "$GITHUB_REF_NAME"

      # the action deletes any release the tag already has, assets and all, so a rerun
      # of a finished tag would take the published release down while it rebuilds; a
      # draft left by a failed run is still replaced
      - name: Refuse to replace a published release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if draft="$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null)" \
            && [ "$draft" = false ]; then
            echo "$GITHUB_REF_NAME is already published; delete it by hand to rebuild it" >&2
            exit 1
          fi

      # stays a draft until every asset uploads, so install.sh never resolves a latest
      # release that is missing its archive
      - uses: taiki-e/create-gh-release-action@eba8ea96c86cca8a37f1b56e94b4d13301fba651 # v1.11.0
        with:
          draft: true
          # the tag's CHANGELOG.md entry becomes the release notes; a tag without one fails
          changelog: CHANGELOG.md

  upload-assets:
    name: upload-assets (${{ matrix.target }})
    needs: create-release
    # runs on pull requests too, where create-release is skipped
    if: ${{ !failure() && !cancelled() }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            # the .2.28 suffix asks cargo-zigbuild for that glibc floor
            build-target: x86_64-unknown-linux-gnu.2.28
            build-tool: cargo-zigbuild
            features: cpu,cuda
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            build-target: aarch64-unknown-linux-gnu.2.28
            build-tool: cargo-zigbuild
            features: cpu
          - os: macos-15
            target: aarch64-apple-darwin
            build-target: aarch64-apple-darwin
            build-tool: cargo
            features: cpu,coreml
    env:
      # maturin's default floor for the macOS arm64 wheel; other OSes ignore this
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install cargo-zigbuild
        if: matrix.build-tool == 'cargo-zigbuild'
        uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2 # v2.90.0
        with:
          tool: cargo-zigbuild@0.24.0

      - name: Install Zig
        if: matrix.build-tool == 'cargo-zigbuild'
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.0
          # a release build never restores objects a pull request may have cached
          use-cache: false

      # default features keep `online`, so the command downloads models on first use
      - id: upload
        uses: taiki-e/upload-rust-binary-action@f0d45ae91ee7b8ee928de7a9d04d893a08bcbec6 # v1.30.2
        with:
          bin: speakrs
          package: speakrs-cli
          features: ${{ matrix.features }}
          target: ${{ matrix.build-target }}
          build-tool: ${{ matrix.build-tool }}
          archive: $bin-$tag-$target
          tar: unix
          checksum: sha256
          locked: true
          dry-run: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          dry-run-intended: ${{ !startsWith(github.ref, 'refs/tags/v') }}

      # the archive must run on the oldest glibc install.sh promises, so fail on any
      # symbol versioned above 2.28, and CUDA must load at run time, so the binary may
      # link only glibc's own libraries
      - name: Check glibc floor and libraries
        if: runner.os == 'Linux'
        shell: bash
        env:
          ARCHIVE: ${{ steps.upload.outputs.tar }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/archive"
          tar -xzf "$ARCHIVE" -C "$RUNNER_TEMP/archive"
          bin="$RUNNER_TEMP/archive/speakrs"
          newest="$(objdump -T "$bin" | grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' | sort -V | tail -n 1)"
          echo "newest glibc symbol: $newest"
          test "$(printf '%s\n2.28\n' "$newest" | sort -V | tail -n 1)" = 2.28
          needed="$(objdump -p "$bin" | awk '$1 == "NEEDED" { print $2 }')"
          echo "$needed"
          if grep -Ev '^(libc|libm|libdl|libpthread|librt|libgcc_s|ld-linux-(x86-64|aarch64))\.so\.[0-9]+$' <<< "$needed"; then
            echo "the binary links a library outside glibc" >&2
            exit 1
          fi

      # Apple silicon kills an unsigned binary, so check the linker's ad-hoc signature
      # survived the strip, and that it links only system libraries, none from Homebrew
      - name: Check signature and libraries
        if: runner.os == 'macOS'
        shell: bash
        env:
          ARCHIVE: ${{ steps.upload.outputs.tar }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/archive"
          tar -xzf "$ARCHIVE" -C "$RUNNER_TEMP/archive"
          bin="$RUNNER_TEMP/archive/speakrs"
          codesign --verify --strict "$bin"
          otool -L "$bin"
          if otool -L "$bin" | tail -n +2 | grep -Ev '^[[:space:]]+(/usr/lib/|/System/Library/)'; then
            echo "the binary links a library outside the system" >&2
            exit 1
          fi

      # the archived binary downloads the CPU models and diarizes the short fixture, so a
      # release never ships a command that can't run its default mode
      - name: Diarize with the archived binary
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/archive/speakrs" --version
          "$RUNNER_TEMP/archive/speakrs" diarize fixtures/test_short.wav \
            --cache-dir "$RUNNER_TEMP/models" > "$RUNNER_TEMP/test_short.rttm"
          cat "$RUNNER_TEMP/test_short.rttm"
          grep -q '^SPEAKER test_short ' "$RUNNER_TEMP/test_short.rttm"

  upload-install-script:
    needs: create-release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Upload install.sh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" install.sh --clobber --repo "$GITHUB_REPOSITORY"

  publish-release:
    needs: [upload-assets, upload-install-script]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Publish draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
