# Publish the speakrs command as a GitHub release when a version tag is pushed
#
#   bump the version in Cargo.toml, move the CHANGELOG.md "Unreleased" entries under a
#   "## [X.Y.Z] - YYYY-MM-DD" heading, merge to master, then
#   git tag vX.Y.Z
#   git push origin vX.Y.Z
#
# The tag must match the speakrs crate version and have a CHANGELOG.md entry, or the
# release fails before anything is built. The Package workflow publishes the Python
# wheels from the same tag; the crates go to crates.io separately.
#
# Asset names match install.sh:
#   speakrs-<tag>-x86_64-unknown-linux-gnu.tar.gz
#   speakrs-<tag>-x86_64-unknown-linux-gnu.sha256
#   install.sh
#
# The speakrs binary is the CUDA tuner (`speakrs cuda tune`), so it ships only where the
# CUDA backend runs: Linux x86_64, the same platform as the CUDA Python wheel. It is built
# with the `cuda` feature, which matches applications built with `cuda`, since a tune file
# applies only to the speakrs version and kernel set that wrote it. The binary opens
# libcuda, cuDNN and cuBLAS with dlopen, which a static musl build can't do, so it ships
# as glibc; cargo-zigbuild links against glibc 2.28, the same floor as the
# manylinux_2_28 wheel, instead of the runner's newer glibc. macOS and CPU builds would
# have no command to run until the binary gains one that diarizes.
#
# Pull requests that touch the release files build and check the archive without
# uploading it.

name: Release

permissions:
  contents: read

on:
  push:
    tags:
      - "v*"
  pull_request:
    branches:
      - master
    paths:
      - .github/workflows/release.yml
      - install.sh

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: -D warnings
  # the shipped binary keeps no symbols or line tables
  CARGO_PROFILE_RELEASE_DEBUG: "false"
  CARGO_PROFILE_RELEASE_STRIP: symbols

jobs:
  create-release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Check the crate matches the tag
        shell: bash
        run: |
          set -euo pipefail
          version="$(cargo metadata --no-deps --format-version 1 --locked \
            | jq -r '.packages[] | select(.name == "speakrs") | .version')"
          echo "crate version: $version, tag: $GITHUB_REF_NAME"
          test "v$version" = "$GITHUB_REF_NAME"

      # stays a draft until every asset uploads, so install.sh never resolves a latest
      # release that is missing its archive
      - uses: taiki-e/create-gh-release-action@eba8ea96c86cca8a37f1b56e94b4d13301fba651 # v1.11.0
        with:
          draft: true
          # the tag's CHANGELOG.md entry becomes the release notes; a tag without one fails
          changelog: CHANGELOG.md

  upload-assets:
    name: upload-assets (${{ matrix.target }})
    needs: create-release
    # runs on pull requests too, where create-release is skipped
    if: ${{ !failure() && !cancelled() }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            # the .2.28 suffix asks cargo-zigbuild for that glibc floor
            build-target: x86_64-unknown-linux-gnu.2.28
            build-tool: cargo-zigbuild
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install cargo-zigbuild
        if: matrix.build-tool == 'cargo-zigbuild'
        uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2 # v2.90.0
        with:
          tool: cargo-zigbuild@0.24.0

      - name: Install Zig
        if: matrix.build-tool == 'cargo-zigbuild'
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.0
          # a release build never restores objects a pull request may have cached
          use-cache: false

      # `online` is left out: the tuner reads models from --models-dir and never
      # downloads, and the tune-file key doesn't depend on it
      - id: upload
        uses: taiki-e/upload-rust-binary-action@f0d45ae91ee7b8ee928de7a9d04d893a08bcbec6 # v1.30.2
        with:
          bin: speakrs
          package: speakrs
          no-default-features: true
          features: cuda
          target: ${{ matrix.build-target }}
          build-tool: ${{ matrix.build-tool }}
          archive: $bin-$tag-$target
          tar: unix
          checksum: sha256
          locked: true
          dry-run: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          dry-run-intended: ${{ !startsWith(github.ref, 'refs/tags/v') }}

      # the archive must run on the oldest glibc install.sh promises, so fail on any
      # symbol versioned above 2.28, and CUDA must load at run time, so the binary may
      # link only glibc's own libraries
      - name: Check glibc floor, libraries and the binary runs
        if: runner.os == 'Linux'
        shell: bash
        env:
          ARCHIVE: ${{ steps.upload.outputs.tar }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/archive"
          tar -xzf "$ARCHIVE" -C "$RUNNER_TEMP/archive"
          bin="$RUNNER_TEMP/archive/speakrs"
          newest="$(objdump -T "$bin" | grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' | sort -V | tail -n 1)"
          echo "newest glibc symbol: $newest"
          test "$(printf '%s\n2.28\n' "$newest" | sort -V | tail -n 1)" = 2.28
          needed="$(objdump -p "$bin" | awk '$1 == "NEEDED" { print $2 }')"
          echo "$needed"
          if grep -Ev '^(libc|libm|libdl|libpthread|librt|libgcc_s|ld-linux-x86-64)\.so\.[0-9]+$' <<< "$needed"; then
            echo "the binary links a library outside glibc" >&2
            exit 1
          fi
          "$bin" --help

  upload-install-script:
    needs: create-release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Upload install.sh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" install.sh --clobber --repo "$GITHUB_REPOSITORY"

  publish-release:
    needs: [upload-assets, upload-install-script]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Publish draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
