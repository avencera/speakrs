name: Package

on:
  workflow_dispatch: {}
  push:
    branches:
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - master

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  crate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
          prefix-key: v1-rust

      - name: Confirm x86_64 host
        shell: bash
        run: |
          set -euo pipefail
          host="$(rustc -vV | sed -n 's/^host: //p')"
          case "$host" in
            x86_64-*) ;;
            *) echo "expected x86_64 host, got $host" >&2; exit 1 ;;
          esac

      # the kernel artifact crates are packaged with speakrs, so its verification
      # resolves them from this checkout before they are on crates.io
      - name: Package crates
        run: |
          rm -rf target/package
          cargo package --locked \
            -p speakrs-ptx-sm75 -p speakrs-ptx-sm80 -p speakrs-ptx-sm120 -p speakrs \
            --features speakrs/cpu

      - name: Check crate sizes
        shell: bash
        run: |
          set -euo pipefail

          # crates.io rejects uploads over 10 MiB unless it has raised the crate's limit
          limit=$((10 * 1024 * 1024))
          too_large=0
          for crate in target/package/*.crate; do
            size="$(stat -c %s "$crate")"
            echo "$(basename "$crate"): $size bytes"
            if [ "$size" -gt "$limit" ]; then
              echo "$crate is over the crates.io limit of $limit bytes" >&2
              too_large=1
            fi
          done
          exit "$too_large"

      - name: Check packaged crate as a dependency
        shell: bash
        run: |
          set -euo pipefail

          package_dir="$(find target/package -mindepth 1 -maxdepth 1 -type d -name 'speakrs-[0-9]*' -print -quit)"
          test -n "$package_dir"

          package_path="$PWD/$package_dir"

          check_consumer() {
            local name="$1"
            local dependency="$2"
            local patch="${3:-}"
            local consumer="$RUNNER_TEMP/speakrs-package-consumer-$name"

            rm -rf "$consumer"
            mkdir -p "$consumer/src"

            cat > "$consumer/Cargo.toml" <<EOF
          [package]
          name = "speakrs-package-consumer-$name"
          version = "0.0.0"
          edition = "2024"
          publish = false

          [dependencies]
          speakrs = $dependency
          $patch
          EOF

            cat > "$consumer/src/lib.rs" <<'EOF'
          pub fn execution_mode() -> speakrs::ExecutionMode {
              speakrs::ExecutionMode::Cpu
          }
          EOF

            echo "Checking packaged crate dependency: $name"
            cargo check --manifest-path "$consumer/Cargo.toml"
          }

          check_consumer cpu "{ path = \"$package_path\", features = [\"cpu\"] }"
          cargo tree --manifest-path "$RUNNER_TEMP/speakrs-package-consumer-cpu/Cargo.toml" \
            --edges normal,build --prefix none > cpu-dependencies.log
          if awk '$1 == "ort" || $1 == "ort-sys" { found = 1 } END { exit !found }' cpu-dependencies.log; then
            echo "the packaged CPU consumer includes ONNX Runtime" >&2
            exit 1
          fi
          # the CPU consumer gets no patch, so this also proves CPU builds resolve
          # without the artifact crates being published
          if awk '$1 ~ /^speakrs-ptx-/ { found = 1 } END { exit !found }' cpu-dependencies.log; then
            echo "the packaged CPU consumer includes CUDA artifact crates" >&2
            exit 1
          fi
          check_consumer load-dynamic "{ path = \"$package_path\", features = [\"cpu\", \"load-dynamic\"] }"

          # the CUDA consumer embeds every tier, so it also proves each packaged artifact
          # crate ships the files its generated source includes
          ptx_patch="[patch.crates-io]"
          for tier in sm75 sm80 sm120; do
            ptx_dir="$(find target/package -mindepth 1 -maxdepth 1 -type d -name "speakrs-ptx-$tier-*" -print -quit)"
            test -n "$ptx_dir"
            ptx_patch+=$'\n'"speakrs-ptx-$tier = { path = \"$PWD/$ptx_dir\" }"
          done
          check_consumer cuda "{ path = \"$package_path\", default-features = false, features = [\"cuda\"] }" "$ptx_patch"
