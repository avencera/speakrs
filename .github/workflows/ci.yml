name: CI

on:
  workflow_dispatch: {}
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # Keep in sync with HF_REVISION in src/models.rs
  SPEAKRS_MODEL_FIXTURE_REV: a785ebdbe6313868088c36c93d9efa71c470bd34

jobs:
  cargo-deny:
    name: Cargo deny
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Check dependency policy
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          rust-version: "1.89.0"
          arguments: --no-default-features --features online,default-linalg,cuda,migraphx,load-dynamic,_metrics

  msrv:
    name: MSRV Rust 1.89
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust 1.89
        uses: dtolnay/rust-toolchain@1.89

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
          prefix-key: v1-rust-msrv

      - name: Check crate
        run: cargo check -p speakrs

  clippy:
    name: Clippy (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-24.04
            features: cuda migraphx load-dynamic _metrics
          - name: Linux arm64
            os: ubuntu-24.04-arm
            features: cuda migraphx load-dynamic _metrics
          - name: macOS arm64
            os: macos-15
            features: coreml cuda migraphx load-dynamic _metrics
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
          prefix-key: v1-rust

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --features "${{ matrix.features }}" -- -D warnings

  test:
    name: Test (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-24.04
          - name: Linux arm64
            os: ubuntu-24.04-arm
          - name: macOS arm64
            os: macos-15
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
          prefix-key: v1-rust

      - name: Cache model fixtures
        uses: actions/cache@v4
        with:
          path: fixtures/models
          key: ${{ runner.os }}-speakrs-model-fixtures-${{ env.SPEAKRS_MODEL_FIXTURE_REV }}

      - name: Download model fixtures
        shell: bash
        run: |
          set -euo pipefail

          base_url="https://huggingface.co/avencera/speakrs-models/resolve/${SPEAKRS_MODEL_FIXTURE_REV}"
          files=(
            plda_lda.npy
            plda_mean1.npy
            plda_mean2.npy
            plda_mu.npy
            plda_psi.npy
            plda_tr.npy
            segmentation-3.0.onnx
            wespeaker-voxceleb-resnet34.min_num_samples.txt
            wespeaker-voxceleb-resnet34.onnx
            wespeaker-voxceleb-resnet34.onnx.data
          )

          mkdir -p fixtures/models
          for file in "${files[@]}"; do
            path="fixtures/models/${file}"
            if [[ ! -s "$path" ]]; then
              curl --retry 3 --retry-delay 5 -LfsS "${base_url}/${file}" -o "$path"
            fi
          done

          for file in "${files[@]}"; do
            test -s "fixtures/models/${file}"
          done

      - name: Run tests
        run: cargo test --workspace

  no-default-features:
    name: Test no-default features (Linux x86_64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
          prefix-key: v1-rust-no-default

      - name: Cache model fixtures
        uses: actions/cache@v4
        with:
          path: fixtures/models
          key: ${{ runner.os }}-speakrs-model-fixtures-${{ env.SPEAKRS_MODEL_FIXTURE_REV }}

      - name: Download model fixtures
        shell: bash
        run: |
          set -euo pipefail

          base_url="https://huggingface.co/avencera/speakrs-models/resolve/${SPEAKRS_MODEL_FIXTURE_REV}"
          files=(
            plda_lda.npy
            plda_mean1.npy
            plda_mean2.npy
            plda_mu.npy
            plda_psi.npy
            plda_tr.npy
            segmentation-3.0.onnx
            wespeaker-voxceleb-resnet34.min_num_samples.txt
            wespeaker-voxceleb-resnet34.onnx
            wespeaker-voxceleb-resnet34.onnx.data
          )

          mkdir -p fixtures/models
          for file in "${files[@]}"; do
            path="fixtures/models/${file}"
            if [[ ! -s "$path" ]]; then
              curl --retry 3 --retry-delay 5 -LfsS "${base_url}/${file}" -o "$path"
            fi
          done

          for file in "${files[@]}"; do
            test -s "fixtures/models/${file}"
          done

      - name: Run no-default-features runtime tests
        run: cargo test -p speakrs --no-default-features --features "online,intel-mkl"
