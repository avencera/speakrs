[advisories]
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
    "CDLA-Permissive-2.0",
    "LicenseRef-Intel-Simplified-Software-License",
]

[[licenses.clarify]]
name = "intel-mkl-src"
expression = "LicenseRef-Intel-Simplified-Software-License"
license-files = [
    { path = "License.txt", hash = 0x3bf8c2d0 },
]

[bans]
multiple-versions = "allow"
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
