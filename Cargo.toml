[workspace]
members = ["xtask"]
exclude = ["scripts/", "crates/speakrs-cuda-kernels"]

[package]
name = "speakrs"
version = "0.6.0"
edition = "2024"
rust-version = "1.89"
description = "Fast Rust speaker diarization with pyannote-level accuracy and native CoreML/CUDA acceleration"
license = "Apache-2.0"
repository = "https://github.com/avencera/speakrs"
documentation = "https://docs.rs/speakrs"
readme = "README.md"
authors = ["Praveen Perera"]
keywords = ["speaker", "diarization", "audio", "pyannote", "onnx"]
categories = ["multimedia::audio", "science"]
include = ["/src/**", "/examples/**", "/README.md", "/LICENSE", "/Cargo.toml"]

[features]
default = ["online"]
online = ["dep:hf-hub", "hf-hub/ureq", "hf-hub/native-tls"]
cpu = ["_ort", "_backend"]
coreml = [
    "dep:block2",
    "dep:objc2",
    "dep:objc2-core-ml",
    "dep:objc2-foundation",
    "_backend",
]
# native NVIDIA backend: optional libraries and committed cuda-oxide PTX through cudarc, with
# safetensors weights; no ONNX Runtime
cuda = ["cuda-sm75", "cuda-sm80", "cuda-sm90", "cuda-sm120", "cudarc/cublas", "cudarc/cudnn", "dep:libloading"]
cuda-driver-only = ["cuda-sm75", "cuda-sm80", "cuda-sm90", "cuda-sm120"]
# internal: driver and committed PTX, without optional numerical libraries
_cuda = ["dep:cudarc", "dep:safetensors", "dep:sha2", "_backend"]
# each GPU target embeds every area's best shipped variant for that target
# tier-only builds use the driver without optional numerical libraries
cuda-sm75 = ["_cuda"]
cuda-sm80 = ["_cuda"]
cuda-sm90 = ["_cuda"]
cuda-sm120 = ["_cuda"]
migraphx = ["_ort", "ort/migraphx", "_backend"]
# load ONNX Runtime at run time instead of linking it; only for the `cpu` and `migraphx`
# backends
load-dynamic = ["_ort", "ort/load-dynamic", "dep:libloading"]

# internal: enabled by every backend that runs on ONNX Runtime
_ort = ["dep:ort"]
# internal: enabled by every inference backend; gates the crate items in `lib.rs`
_backend = []
_metrics = []

[package.metadata.docs.rs]
features = ["cpu", "cuda", "cuda-driver-only", "cuda-sm75", "cuda-sm80", "cuda-sm90", "cuda-sm120", "migraphx", "load-dynamic", "_metrics"]

[dependencies]
sha2 = { version = "0.10", optional = true }
hf-hub = { version = "0.5", optional = true, default-features = false }

# math
kodama = "0.3.0"
ndarray = { version = "0.17.2", features = ["matrixmultiply-threading"] }
ndarray-npy = "0.10.0"

ort = { version = "2.0.0-rc.13", features = ["ndarray"], optional = true }

# native CUDA: libcuda, cuBLAS and cuDNN are loaded at run time, so the crate builds
# without a CUDA toolkit (including on macOS). The 12.4 API floor keeps the CUDA 12.4
# canary image working; the PTX itself is JIT-compiled by the installed driver
cudarc = { version = "0.19.10", optional = true, default-features = false, features = [
    "std",
    "driver",
    # the precompiled `Ptx` type requires this feature but does not load NVRTC
    "nvrtc",
    "dynamic-loading",
    "cuda-12040",
] }
safetensors = { version = "0.8.0", optional = true, default-features = false, features = ["alloc"] }
libloading = { version = "0.9.0", optional = true }

# logging
tracing = "0.1.44"

# error handling
thiserror = "2.0.18"

# concurrency
crossbeam-channel = "0.5"
rayon = "1.11.0"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", optional = true }
block2 = { version = "0.6", optional = true }
objc2-core-ml = { version = "0.3", optional = true, features = [
    "MLModel",
    "MLMultiArray",
    "MLModelConfiguration",
    "MLDictionaryFeatureProvider",
    "MLFeatureValue",
    "MLFeatureProvider",
    "MLPredictionOptions",
    "alloc",
    "block2",
] }

objc2-foundation = { version = "0.3", optional = true, features = [
    "NSArray",
    "NSDictionary",
    "NSError",
    "NSObject",
    "NSString",
    "NSURL",
    "NSValue",
    "NSSet",
    "NSEnumerator",
    "NSObjCRuntime",
] }

# the examples load ONNX models in `ExecutionMode::Cpu`
[[example]]
name = "assign_transcript_speakers"
required-features = ["cpu"]

[[example]]
name = "diarize_wav"
required-features = ["cpu"]

[[example]]
name = "print_turns"
required-features = ["cpu"]

[[example]]
name = "queued"
required-features = ["cpu"]

[[example]]
name = "speaker_airtime"
required-features = ["cpu"]

[dev-dependencies]
sha2 = "0.10"
libloading = "0.9.0"
approx = "0.5.1"
serde_json = "1"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
