[workspace]
members = ["xtask"]
exclude = ["scripts/", "crates/speakrs-cuda-kernels"]

[package]
name = "speakrs"
version = "0.6.0"
edition = "2024"
rust-version = "1.89"
description = "Fast Rust speaker diarization with pyannote-level accuracy and native CPU/CoreML/CUDA inference"
license = "Apache-2.0"
repository = "https://github.com/avencera/speakrs"
documentation = "https://docs.rs/speakrs"
readme = "README.md"
authors = ["Praveen Perera"]
keywords = ["speaker", "diarization", "audio", "pyannote", "onnx"]
categories = ["multimedia::audio", "science"]
include = ["/src/**", "/examples/**", "/README.md", "/LICENSE", "/Cargo.toml"]

[features]
default = ["online"]
online = ["dep:hf-hub", "hf-hub/ureq", "hf-hub/native-tls"]
cpu = ["dep:safetensors", "dep:rustfft", "dep:libloading", "_backend"]
coreml = [
    "dep:block2",
    "dep:objc2",
    "dep:objc2-core-ml",
    "dep:objc2-foundation",
    "_backend",
]
# native NVIDIA backend: cuBLAS, cuDNN and committed cuda-oxide PTX through cudarc, with
# safetensors weights; no ONNX Runtime
cuda = ["dep:cudarc", "dep:safetensors", "_backend"]
# native CUDA kernels for newer GPUs, off by default: without them the binary carries
# only sm_75 PTX, which the driver JIT-compiles for Turing and every newer GPU
cuda-sm80 = ["cuda"]
cuda-sm90 = ["cuda"]
cuda-sm120 = ["cuda"]
migraphx = ["_ort", "ort/migraphx", "_backend"]
# load ONNX Runtime at run time for MIGraphX or caller-created CPU sessions
# native CPU model execution does not use this runtime
load-dynamic = ["_ort", "ort/load-dynamic", "dep:libloading"]

# internal: ONNX Runtime support for MIGraphX and external session helpers
_ort = ["dep:ort"]
# internal: enabled by every inference backend; gates the crate items in `lib.rs`
_backend = []
_metrics = []

[package.metadata.docs.rs]
features = ["cpu", "cuda", "migraphx", "load-dynamic", "_metrics"]

[dependencies]
hf-hub = { version = "0.5", optional = true, default-features = false }

# math
rustfft = { version = "6.4.1", optional = true }
kodama = "0.3.0"
ndarray = { version = "0.17.2", features = ["matrixmultiply-threading"] }
ndarray-npy = "0.10.0"

ort = { version = "2.0.0-rc.13", features = ["ndarray"], optional = true }

# native CUDA: libcuda, cuBLAS and cuDNN are loaded at run time, so the crate builds
# without a CUDA toolkit (including on macOS). The 12.4 API floor keeps the CUDA 12.4
# canary image working; the PTX itself is JIT-compiled by the installed driver
cudarc = { version = "0.19.10", optional = true, default-features = false, features = [
    "std",
    "driver",
    # the `Ptx` type that module loading takes, and the probe for the NVRTC library that
    # cuDNN's persistent-dynamic LSTM needs; speakrs itself never compiles with NVRTC
    "nvrtc",
    "cublas",
    "cudnn",
    "dynamic-loading",
    "cuda-12040",
] }
safetensors = { version = "0.8.0", optional = true, default-features = false, features = ["alloc"] }
libloading = { version = "0.9.0", optional = true }

# logging
tracing = "0.1.44"

# error handling
thiserror = "2.0.18"

# concurrency
crossbeam-channel = "0.5"
rayon = "1.11.0"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", optional = true }
block2 = { version = "0.6", optional = true }
objc2-core-ml = { version = "0.3", optional = true, features = [
    "MLModel",
    "MLMultiArray",
    "MLModelConfiguration",
    "MLDictionaryFeatureProvider",
    "MLFeatureValue",
    "MLFeatureProvider",
    "MLPredictionOptions",
    "alloc",
    "block2",
] }

objc2-foundation = { version = "0.3", optional = true, features = [
    "NSArray",
    "NSDictionary",
    "NSError",
    "NSObject",
    "NSString",
    "NSURL",
    "NSValue",
    "NSSet",
    "NSEnumerator",
    "NSObjCRuntime",
] }

# the examples load native model assets in `ExecutionMode::Cpu`
[[example]]
name = "assign_transcript_speakers"
required-features = ["cpu"]

[[example]]
name = "diarize_wav"
required-features = ["cpu"]

[[example]]
name = "print_turns"
required-features = ["cpu"]

[[example]]
name = "queued"
required-features = ["cpu"]

[[example]]
name = "speaker_airtime"
required-features = ["cpu"]

[dev-dependencies]
hound = "3.5.1"
sha2 = "0.10"
libloading = "0.9.0"
approx = "0.5.1"
serde_json = "1"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
