[package]
name = "speakrs-sdk"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Binding-friendly facade over speakrs: audio decoding, model preparation, and plain result types"
publish = false

[features]
default = ["online", "cpu"]
# download models from Hugging Face over rustls, so wheels never link OpenSSL
online = ["speakrs/online"]
cpu = ["speakrs/cpu"]
coreml = ["speakrs/coreml"]
# every GPU tier plus the cuDNN/cuBLAS fallback, loaded at run time
cuda = ["speakrs/cuda"]

[dependencies]
crossbeam-channel = "0.5"
rubato = "5.0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
speakrs = { path = "../..", default-features = false }
symphonia = { version = "0.6.1", default-features = false, features = [
    "aac",
    "flac",
    "isomp4",
    "mp3",
    "ogg",
    "pcm",
    "vorbis",
    "wav",
] }
thiserror = "2.0.21"

[dev-dependencies]
hound = "3.5.1"
